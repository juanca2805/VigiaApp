<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>Vigía de aseo</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --mut:#94a3b8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px system-ui,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; }
  h1 { font-size:18px; margin:0; }
  #estado { font-size:12px; color:var(--mut); }
  #vista { position:relative; margin:0 16px; border-radius:12px; overflow:hidden; background:#000; aspect-ratio:3/4; max-height:60vh; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #sello { position:absolute; left:8px; top:8px; background:#0009; padding:3px 8px; border-radius:6px; font-size:12px; }
  .barra { display:flex; gap:8px; padding:10px 16px; flex-wrap:wrap; }
  button { background:var(--card); color:var(--txt); border:1px solid #334155; border-radius:10px; padding:10px 14px; font-size:14px; }
  button.on { border-color:var(--ok); }
  button.p { background:var(--ok); color:#052e16; border:0; font-weight:600; }
  button.d { background:var(--bad); color:#fff; border:0; }
  section { padding:0 16px 12px; }
  h2 { font-size:15px; margin:8px 0; }
  .alerta { background:var(--card); border-left:4px solid var(--bad); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .alerta.cerrada { border-color:var(--ok); opacity:.75; }
  .alerta small { color:var(--mut); display:block; margin:2px 0 8px; }
  .alerta img { width:100%; border-radius:8px; margin:6px 0; }
  .vacio { color:var(--mut); }
  details { background:var(--card); border-radius:10px; padding:8px 12px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 0; }
  input[type=range] { width:50%; } input[type=text] { width:55%; padding:6px; border-radius:6px; border:1px solid #334155; background:var(--bg); color:var(--txt); }
</style>
</head>
<body>
<header><h1>🧹 Vigía de aseo</h1><span id="estado">Cargando…</span></header>

<div id="vista">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="lienzo"></canvas>
  <div id="sello"></div>
</div>

<div class="barra">
  <button id="btnIniciar" class="p">▶ Iniciar cámara</button>
  <button id="btnPausa">⏸ Pausar</button>
  <button id="btnMov" class="on">Movimiento</button>
  <button id="btnDet" class="on">Detecciones</button>
  <button id="btnCam">🔄 Cámara</button>
</div>

<section>
  <h2>Alertas <span id="contador"></span></h2>
  <div id="alertas"><p class="vacio">Sin alertas. Deja un objeto (botella, vaso, mochila) quieto frente a la cámara.</p></div>
  <div class="barra" style="padding:0">
    <button id="btnJson">⬇ Exportar JSON</button>
    <button id="btnNotif">🔔 Activar avisos</button>
  </div>
</section>

<section>
  <details>
    <summary>Ajustes</summary>
    <label>Camara <input type="text" id="sCamara"></label>
    <label>Confianza mínima <span id="vConf"></span><input type="range" id="sConf" min="0.2" max="0.95" step="0.05"></label>
    <label>Quieto (segundos) <span id="vPers"></span><input type="range" id="sPers" min="3" max="180" step="1"></label>
    <label>Persona cerca (% encuadre) <span id="vDist"></span><input type="range" id="sDist" min="5" max="50" step="1"></label>
    <label>Webhook (URL) <input type="text" id="sHook" placeholder="https://…"></label>
    <p class="vacio">Modo prueba: botella, vaso, mochila y bolso se tratan como "basura". Con un modelo propio entrenado se añaden heces y derrame.</p>
  </details>
</section>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script src="detector.js"></script>
<script src="app.js"></script>
</body>
</html>
