server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Cloud Run limita a 32 MiB las respuestas HTTP/1 con Content-Length; el modelo ONNX pesa ~120 MB.
    # Con gzip nginx responde por trozos (chunked) y el límite no aplica.
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_types application/octet-stream application/javascript application/json text/html;
    types { application/octet-stream onnx; }

    # el modelo cambia al reentrenar: que el navegador revalide siempre
    location /modelo/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        # cámara y sensores solo para esta página
        add_header Permissions-Policy "camera=(self)";
        try_files $uri $uri/ =404;
    }
}
